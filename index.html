<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[School Name] | [School Tagline] in [City], Nigeria</title>
    <meta name="description" content="[School Name] - Top-rated school in [City] offering quality education from Nursery to Senior Secondary. Apply for admission now." />
    <meta name="keywords" content="best school in [City], school in [Area], admission [City], Nigerian school, international school [City], [School Name]" />
    <meta property="og:title" content="[School Name] | [School Tagline]" />
    <meta property="og:description" content="Quality education from Nursery to Senior Secondary. Apply for admission now." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
    <!-- Schema.org structured data for EducationalOrganization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "[School Name]",
      "description": "Quality education from Nursery to Senior Secondary School in [City], Nigeria",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "[Street Address]",
        "addressLocality": "[City]",
        "addressCountry": "NG"
      },
      "telephone": "+234 [XXX] [XXX] [XXXX]",
      "email": "info@[schoolname].ng",
      "url": "[School Website URL]"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
